# Runs on the staging web host. Pulls the image built by
# .github/workflows/deploy-dev.yml -- never built locally here.
#
# All secret values come from a .env file that lives next to this file on
# the server ONLY (never committed -- see docs/private/INFRASTRUCTURE.md
# for the real values). docker compose reads a .env file in the same
# directory automatically, no extra flag needed.

services:
  web:
    image: ghcr.io/denidim/handyfix-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      # The admin account's login email and password. Both are read at one
      # start only, the first start of a database, which makes the account.
      # After that they are changed in the admin panel, on the Account page.
      Admin__SeedEmail: ${ADMIN_SEED_EMAIL:-}
      Admin__SeedPassword: ${ADMIN_SEED_PASSWORD}
      Brevo__ApiKey: ${BREVO_API_KEY}
      Email__BookingsFromAddress: ${EMAIL_BOOKINGS_FROM_ADDRESS}
      Email__SystemFromAddress: ${EMAIL_SYSTEM_FROM_ADDRESS}
      # A mark in front of every subject. Staging sends from the live site's
      # address, so without one a test email reads exactly like a real one.
      Email__SubjectPrefix: ${EMAIL_SUBJECT_PREFIX:-}
      # Where notices to the company go (paid deposits, enquiries, job
      # applications). Empty means the real info@ inbox; staging sets its own
      # so test enquiries do not land there.
      Admin__NotificationEmail: ${ADMIN_NOTIFICATION_EMAIL:-}
      # Cloudflare Turnstile, the "are you a person" check on the public
      # forms. Outside Development the forms fail without both keys, on
      # purpose, so set them in .env before deploying a build that has it.
      Turnstile__SiteKey: ${TURNSTILE_SITE_KEY}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY}
      # No real Stripe account yet -- lets staging demo the full booking
      # flow via the sandbox bypass. Remove this and set Stripe__SecretKey
      # instead once a real (test-mode) Stripe account exists.
      Stripe__AllowSandboxOutsideDevelopment: "true"
      # CloudflareR2:* settings for photo uploads.
      CloudflareR2__AccessKeyId: ${R2_ACCESS_KEY_ID}
      CloudflareR2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY}
      CloudflareR2__ServiceUrl: ${R2_SERVICE_URL}
      CloudflareR2__PublicUrl: ${R2_PUBLIC_URL}
      CloudflareR2__BucketName: ${R2_BUCKET_NAME}
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAGING_HOSTNAME: ${STAGING_HOSTNAME}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - web

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
