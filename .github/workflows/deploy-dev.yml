name: Deploy to Staging

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/HandyFix.sln

      - name: Build
        run: dotnet build src/HandyFix.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/HandyFix.sln --no-build -c Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/denidim/handyfix-web:latest
            ghcr.io/denidim/handyfix-web:${{ github.sha }}

      # The server's copies of these two used to be put there by hand, and a change
      # pushed here did nothing until somebody remembered to copy it over. The .env
      # beside them is not copied: it holds the secrets and lives on the server only.
      - name: Copy the compose file and the Caddyfile to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "deploy/docker-compose.staging.yml,deploy/caddy/staging/Caddyfile"
          target: /opt/handyfix/deploy
          strip_components: 1

      - name: Deploy to staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/handyfix/deploy
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d

            # Caddy reads its Caddyfile when it starts, so one that has just been
            # copied over is taken up here, without dropping a connection. Tried a
            # few times because a Caddy that "up" has only just started needs a
            # moment before it answers.
            reloaded=no
            for attempt in 1 2 3 4 5; do
              if docker compose -f docker-compose.staging.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile; then
                reloaded=yes
                break
              fi
              sleep 2
            done
            [ "$reloaded" = yes ]

            docker image prune -f
