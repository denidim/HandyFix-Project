  </defs>
  <g stroke-width="8" stroke-linejoin="round">
    <path d="M309 30 C298 70 248 110 248 154 A61 61 0 0 0 370 154 C370 110 320 70 309 30 Z" fill="url(#blue)" stroke="#3a86bd"/>
    <path d="M428 2 A44 44 0 0 1 448 84 L448 160 A26 26 0 1 1 408 160 L408 84 A44 44 0 0 1 428 2 Z" fill="url(#red)" stroke="#b92a42" mask="url(#wrench-cut)"/>
    <path d="M568 44 L606 79 L606 60 L630 60 L630 101 L660 129 L636 129 L636 210 L500 210 L500 129 L476 129 Z" fill="url(#yellow)" stroke="#dca33a" mask="url(#house-cut)"/>
  </g>
