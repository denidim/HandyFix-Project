<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 -105 430 430">
  <!-- Browser-tab icon: the logo's three icons only (drop, wrench, house). No filters or text:
       neither survives at 16-32px. Kept in step with Views/Shared/_Logo.cshtml. -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad3ee"/>
      <stop offset="1" stop-color="#3f93c9"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d23a52"/>
      <stop offset="1" stop-color="#e3677b"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77f"/>
      <stop offset="1" stop-color="#e8b447"/>
    </linearGradient>
    <mask id="wrench-cut">
      <rect x="240" y="-105" width="430" height="430" fill="#fff"/>
      <rect x="413" y="-10" width="30" height="46" fill="#000"/>
      <circle cx="428" cy="36" r="15" fill="#000"/>
      <circle cx="428" cy="184" r="8" fill="#000"/>
    </mask>
    <mask id="house-cut">
      <rect x="240" y="-105" width="430" height="430" fill="#fff"/>
      <rect x="551" y="158" width="34" height="60" rx="5" fill="#000"/>
